services:
  - type: web
    name: car-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd ../.. && npm ci && npx prisma generate --schema=prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: car-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    healthCheckPath: /api/health

databases:
  - name: car-db
    region: oregon
    databaseName: car
    plan: free
    ipAllowList: []
