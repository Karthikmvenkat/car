name: API security verification

on:
  pull_request:
    paths: ['apps/api/**', 'prisma/**', 'scripts/**', 'specs/**', 'package*.json', '.github/workflows/api-security.yml']
  push:
    branches: ['main', 'codex/**']
    paths: ['apps/api/**', 'prisma/**', 'scripts/**', 'specs/**', 'package*.json', '.github/workflows/api-security.yml']

permissions:
  contents: read

concurrency:
  group: api-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: car_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: car_security_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U car_test -d car_security_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Ephemeral CI service only. No production secrets or environment access.
      DATABASE_URL: postgresql://car_test:fixture-only-password@127.0.0.1:5432/car_security_test_ci
      CAR_TEST_DATABASE_URL: postgresql://car_test:fixture-only-password@127.0.0.1:5432/car_security_test_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: npm run test:api:database
      - run: npm run build:api
      - run: npm run check:ui-baseline
      - run: node node_modules/typescript/bin/tsc --project apps/web/tsconfig.json --noEmit --incremental false
